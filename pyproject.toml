[project]
name = "arc-schema-reproduction"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "arc-agi>=0.9.9",
    "openai>=2.46.0",
    "python-dotenv>=1.2.2",
]

[project.scripts]
arc-schema = "arc_schema.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arc_schema"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
